name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Test Server
        run: npm --prefix server test

      - name: Build docs and verify links
        env:
          VITEPRESS_BASE: /
        run: |
          sed -i \
            "s/puppeteer.launch({ headless: 'shell' })/puppeteer.launch({ headless: 'shell', args: ['--no-sandbox'] })/" \
            scripts/render-mermaid.mjs
          grep -Fq "puppeteer.launch({ headless: 'shell', args: ['--no-sandbox'] })" scripts/render-mermaid.mjs
          npm run docs:build
